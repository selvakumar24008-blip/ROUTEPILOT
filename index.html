function newDis(type,route,sev,extra={}){if(!S.routes.find(r=>r.id==route))return;const d={id:'X-'+(S.dis.length+1),type,route,severity:sev,time:now(),active:true,...extra};S.dis.push(d);L('🚧 '+type.replace(/_/g,' ').toLowerCase()+' detected on '+route);d.im=1;const im=analyze(d);d.vids=im.vehicles.map(v=>v.id);d.delay=im.delay;recInc(d,im);AU('reported '+d.type.replace(/_/g,' ').toLowerCase()+' on '+d.route);L('🧠 Impact analysis completed');L(`📦 ${im.deliveries.length} deliveries identified as affected`);im.deliveries.forEach(x=>{x.issue={type:d.type,route:d.route,time:d.time,delay:im.delay}});
if(d.type=='ROAD_CLOSURE'||d.type=='ACCIDENT'){S.routes.find(r=>r.id==route).status='BLOCKED';im.deliveries.forEach(x=>x.status='AT_RISK')}else{S.routes.find(r=>r.id==route).status='DISRUPTED';im.deliveries.forEach(x=>x.status='AT_RISK')}
if(d.type=='VEHICLE_BREAKDOWN'&&d.vehicle){const bv=S.veh.find(v=>v.id==d.vehicle);if(bv)bv.status='BREAKDOWN'}const recs=recommend(d,im);L('💡 '+recs[0].action+' recommended');cur={d,im,recs,done:false};save();role=='drv'?dRender():go('impact')}
function apply(id){const r=cur.recs.find(x=>x.id==id),{d}=cur;L('✅ Operator approved: '+r.action);
if(r.veh&&r.to){S.veh.find(v=>v.id==r.veh).route=r.to}if(r.id=='assign'){const v=S.veh.find(v=>v.id==r.veh);v.status='IN_TRANSIT';v.route=d.route}
cur.im.deliveries.forEach(x=>{const me=r.id!='resched'||x.id==r.del;x.status=r.id=='resched'&&x.id==r.del?'RESCHEDULED':'ON_TIME';x.issue=Object.assign(x.issue||{type:d.type,route:d.route,time:d.time,delay:cur.im.delay},{plan:me?r.action:'Another delivery on this route was rescheduled, so yours continues on schedule',delay2:me?r.delay:0,upd:now()})});{const rr=S.routes.find(x=>x.id==d.route);if(!r.to&&rr.status!='BLOCKED')rr.status='SLOW'}d.active=false;cur.done=true;cur.applied=r;AU('approved plan "'+r.action+'" on '+d.route);resInc(d,r);L('🔄 Routes updated — delay '+fmt(cur.im.delay)+' → '+fmt(r.delay));save();go('impact')}

S.veh.forEach(v=>{const k=R.findIndex(r=>r.id==v.route);if(k<0)return;const j=cnt[v.route]=(cnt[v.route]||0)+1,x=300+((j-1)%4)*28;s+=`<circle cx="${x}" cy="${y(k)}" r="6" style="fill:${v.status=='BREAKDOWN'?'#ff5d5d':'var(--acc)'};stroke:var(--onacc);stroke-width:2"/><text x="${x-8}" y="${y(k)+20}" font-size="9" style="fill:var(--mut)">${v.id}</text>`});

<script>
/* =====================================================================
   RoutePilot – Response Options Engine
   Extends the operator's "Impact & Plan" page with:
     1 Transfer cargo to a nearby truck      5 Hire a local carrier
     2 Reassign the nearest truck            6 Hold and notify
     3 Split the load by priority            7 Customer pickup / hub handover
     4 Alternate road for every route (Reroute)
   plus the existing Assign-depot-truck and Reschedule options, a
   "Response Playbook" page, an action checklist, ready-to-send customer
   messages and per-driver instructions.
   Loaded AFTER app.js and extras.js (it overrides a few functions).
   ===================================================================== */
(function () {
  'use strict';

  /* ---------- assumptions you can tune ---------- */
  const PARCEL = 15;          // % of one truck taken by one consignment (estimate)
  const URG = { CRITICAL: 3, HIGH: 2, NORMAL: 1, LOW: 0 };
  const RK = { LOW: 0, MEDIUM: 1, HIGH: 2 };
  const SPEED = 50, COSTKM = 18, REROUTE_BUFFER = 15;   // km/h, ₹ per extra km (fuel + driver), minutes to re-brief drivers
  const detourMin = (a, ar) => Math.round(a.extra / cfg().speed * 60 * (ar && ar.status == 'SLOW' ? 1.5 : 1)) + cfg().buffer;
  const costFor = (d, base) => base + Math.round((d >= 999 ? 100 : Math.min(d, 500)) * cfg().costKm);

  /* approximate road distances (km) between the cities used in the sample data */
  const ROAD = [
    ['Coimbatore', 'Tiruppur', 48], ['Coimbatore', 'Erode', 100], ['Coimbatore', 'Perundurai', 85],
    ['Coimbatore', 'Salem', 160], ['Coimbatore', 'Chennai', 500], ['Coimbatore', 'Bengaluru', 365],
    ['Tiruppur', 'Erode', 55], ['Tiruppur', 'Perundurai', 45], ['Tiruppur', 'Salem', 120],
    ['Tiruppur', 'Chennai', 450], ['Tiruppur', 'Bengaluru', 320], ['Erode', 'Perundurai', 15],
    ['Erode', 'Salem', 65], ['Erode', 'Chennai', 400], ['Erode', 'Bengaluru', 265],
    ['Perundurai', 'Salem', 80], ['Perundurai', 'Chennai', 415], ['Perundurai', 'Bengaluru', 280],
    ['Salem', 'Chennai', 340], ['Salem', 'Bengaluru', 200], ['Chennai', 'Bengaluru', 350]
  ];
  const KMT = {};
  ROAD.forEach(([a, b, k]) => { KMT[a + '|' + b] = k; KMT[b + '|' + a] = k; });

  /* alternate road for EVERY route. `id` = an existing route you can move trucks onto;
     without `id` the truck keeps its route id and follows the `via` road.
     SAMPLE DATA – confirm the real alternate roads for your network. */
  const ALT = {
    'R-101': { via: 'via Palladam road', extra: 9 },
    'R-102': { id: 'R-105', via: 'via R-105 (Perundurai)', extra: 12 },
    'R-103': { via: 'via Karur–Namakkal', extra: 45 },
    'R-104': { via: 'via Salem–Krishnagiri–Vellore', extra: 30 },
    'R-105': { id: 'R-102', via: 'via R-102 (direct road)', extra: 0 },
    'R-106': { via: 'via Satyamangalam–Mysuru road', extra: 55 },
    'R-107': { via: 'via Erode–Sankari', extra: 25 },
    'R-108': { via: 'via Bhavani–Mettur road', extra: 20 }
  };

  /* ---------- small helpers ---------- */
  const norm = c => String(c || '').replace(/\s*\(.*\)/, '').trim();
  const km = (a, b) => { a = norm(a); b = norm(b); return a && a === b ? 0 : (KMT[a + '|' + b] ?? 999); };
  const leg = (from, to, add, min) => { const k = km(from, to); return k >= 999 ? Math.max(min || 0, 45) : Math.max(min || 0, k + add); };
  const free = v => Math.max(0, 100 - (+v.cap || 0));
  const cityOf = a => String(a || '').split(',').pop().trim();
  const urg = x => URG[x.pri] ?? 1;
  const idsOf = a => a.map(x => x.id || x).join(', ');
  const tname = t => String(t).replace(/_/g, ' ').toLowerCase();
  const plural = (n, w) => n + ' ' + w + (n == 1 ? '' : 's');
  const V_ = id => S.veh.find(v => v.id == id);
  const finishing = v => { const r = S.routes.find(x => x.id == v.route); return !!r && norm(r.to) == norm(v.loc); };

  /* ======================= RECOMMENDATION ENGINE ======================= */
  function recommend(d, im) {
    const T = d.type, rt = im.route, R = [];
    const trouble = T == 'VEHICLE_BREAKDOWN' && d.vehicle;
    const brk = trouble ? V_(d.vehicle) : null;                       // truck that cannot continue
    const rep = d.vehicle ? V_(d.vehicle) : null;                     // truck at the scene
    const ds = im.deliveries.slice().sort((a, b) => urg(b) - urg(a)); // most urgent first
    const urgent = ds.filter(x => urg(x) >= 2);
    const topU = ds.length ? urg(ds[0]) : 0;
    const able = im.vehicles.filter(v => !['BREAKDOWN', 'OFFLINE'].includes(v.status) && !(brk && v.id == brk.id));
    const scene = rep || im.vehicles[0];
    const where = norm(scene ? scene.loc : rt.from);                  // where the problem is
    const busy = new Set(im.vehicles.map(v => v.id));
    const sOf = a => a.map(x => x.id);

    /* 1 ── Reroute via alternate road (every route has one now) */
    const a = ALT[d.route], altR = a && a.id ? S.routes.find(x => x.id == a.id) : null, altOK = !a || !a.id || (!!altR && !['BLOCKED', 'DISRUPTED'].includes(altR.status));
    if (a && altOK && able.length && (['ROAD_CLOSURE', 'ACCIDENT'].includes(T) || (['TRAFFIC', 'WEATHER'].includes(T) && d.severity == 'HIGH'))) {
      const vs = able.map(v => v.id), delay = detourMin(a, altR), drv = {};
      vs.forEach(i => drv[i] = { c: 'go', t: `🔄 NEW ROUTE APPROVED<br>Please go ${esc(a.via)}. Control center updated your plan.` });
      R.push({
        id: 'reroute', icon: '🔄', action: `Reroute ${vs.length > 1 ? 'Vehicles' : 'Vehicle'} ${vs.join(', ')} ${a.via}`,
        reason: `Main road is affected; ${a.id ? 'alternative route ' + a.id + ' is ' + altR.status.toLowerCase() + ' (checked)' : 'an alternate road avoids it (not live-checked)'} (+${a.extra} km, about ${fmt(delay)} extra)`,
        delay, cost: Math.round(a.extra * cfg().costKm) * vs.length, risk: altR && altR.status == 'SLOW' ? 'MEDIUM' : 'LOW', veh: vs[0], vehs: vs, to: a.id, via: a.via, drv,
        steps: [
          `Check ${a.via} on live traffic or call the highway patrol: confirm it is open and suitable for the truck size.`,
          `Send the new route to ${vs.join(', ')} by phone and get the driver's acknowledgement.`,
          `Update the ETA (+${fmt(delay)}) and send the customer messages below.`,
          `Re-check the blocked road every 30 minutes and move back to the normal route once it clears.`],
        caution: `Adds about ${a.extra} km: check fuel, tolls and height/weight limits on the alternate road.`
      });
    }

    /* 2 ── Assign the idle depot truck (existing option, now distance-aware) */
    const spare = S.veh.find(v => v.status == 'AVAILABLE' && v.cap <= 40);
    if (spare && im.vehicles.length) {
      const dist = km(spare.loc, where), delay = leg(spare.loc, where, 15, 40);
      R.push({
        id: 'assign', icon: '🚚', action: `Assign Vehicle ${spare.id}`,
        reason: `${spare.id} is idle at ${spare.loc} with ${free(spare)}% free space${dist < 999 ? ' (' + dist + ' km from the problem)' : ''}`,
        delay, cost: costFor(dist, 300), risk: 'LOW', veh: spare.id, takeAll: !!brk,
        drv: { [spare.id]: { c: 'go', t: `🚚 NEW TASK<br>Go to ${esc(where)} and take over the affected deliveries on ${d.route}.` } },
        steps: [
          `Confirm ${spare.id} (${spare.driver}) is ready and the load fits (${free(spare)}% free).`,
          `Dispatch to ${where} and share the location and the contact of the driver on site.`,
          `Hand over invoices / e-way bills and note the seal numbers.`,
          `Send the customer messages below with the new ETA (+${fmt(delay)}).`],
        caution: `Slowest option when the depot is far; costs extra for the distance driven.`
      });
    }

    /* 3 ── Transfer cargo to a nearby truck on the same route */
    if (brk) {
      const bd = ds.filter(x => x.veh == brk.id);
      const hs = S.veh.filter(v => v.id != brk.id && v.route == d.route && v.status == 'IN_TRANSIT' && free(v) >= 20 && km(v.loc, brk.loc) <= 120)
        .sort((p, q) => km(p.loc, brk.loc) - km(q.loc, brk.loc) || free(q) - free(p));
      const h = hs[0];
      if (bd.length && h) {
        const bcap = +brk.cap || PARCEL * bd.length, share = Math.max(1, Math.round(bcap / bd.length));
        const full = free(h) >= bcap;
        const n = full ? bd.length : Math.min(bd.length, Math.max(1, Math.round(free(h) / share)));
        const moved = bd.slice(0, n), left = bd.slice(n), load = full ? bcap : Math.min(free(h), n * share);
        const dist = km(h.loc, brk.loc), delay = leg(h.loc, brk.loc, 20, 30);
        R.push({
          id: 'transfer', icon: '🔁',
          action: `Transfer ${full ? 'full load' : n + ' of ' + bd.length + ' consignments'} from ${brk.id} to ${h.id}`,
          reason: full ? `${h.id} is ${dist} km away on ${d.route} with ${free(h)}% free space`
                       : `${h.id} is ${dist} km away but has only ${free(h)}% free space, so the most urgent consignments move first`,
          delay, cost: costFor(dist, 100), risk: full ? 'LOW' : 'MEDIUM', veh: h.id, from: brk.id,
          moved: sOf(moved), left: sOf(left), load,
          note: left.length ? `Remaining ${idsOf(left)} wait for a recovery truck (rescheduled)` : '',
          drv: {
            [brk.id]: { c: 'warn', t: `⚠️ STAY WITH YOUR TRUCK<br>${esc(h.id)} (${esc(h.driver)}) is coming to take ${idsOf(moved)}. Hazard lights on, keep the cargo sealed.` },
            [h.id]: { c: 'go', t: `🔁 CARGO TRANSFER<br>Go to ${esc(brk.loc)} and take over ${idsOf(moved)} from ${esc(brk.id)}. Check seals and sign the transfer note.` }
          },
          steps: [
            `Keep ${brk.id} parked safely (hazard lights, warning triangle). Do not unload until ${h.id} arrives.`,
            `Ask ${h.driver} (${h.id}) to meet at ${brk.loc}: about ${dist} km away.`,
            `Transfer in priority order: ${idsOf(moved)}. Check seals, count and damage; both drivers sign a transfer note and photograph the load.`,
            `The system moves the moved deliveries to ${h.id} when you approve; then send the customer messages below.`,
            left.length ? `Arrange a mechanic or recovery truck for ${brk.id}; ${idsOf(left)} go out later.` : `Arrange a mechanic or recovery truck for ${brk.id}.`],
          caution: `${h.id} has ${free(h)}% free space: stay within legal weight limits and check temperature-sensitive or fragile goods before moving them.`
        });
      }
    }

    /* 4 ── Reassign the nearest truck that is close to finishing its own route */
    if (brk || T == 'OTHER' || T == 'DELIVERY_CHANGE') {
      const v = S.veh.filter(x => !busy.has(x.id) && x.status == 'IN_TRANSIT' && /^R-/.test(x.route) && x.route != d.route && finishing(x) && km(x.loc, where) <= 300)
        .sort((p, q) => km(p.loc, where) - km(q.loc, where))[0];
      if (v && ds.length) {
        const pend = S.del.filter(x => x.veh == v.id && x.status != 'COMPLETED').length;
        const dist = km(v.loc, where), delay = leg(v.loc, where, 20, 30);
        const drv = { [v.id]: { c: 'go', t: `🚚 NEW TASK<br>After your last drop, go to ${esc(where)} and take over ${idsOf(ds)} (${d.route}).` } };
        if (brk) drv[brk.id] = { c: 'warn', t: `⚠️ STAY WITH YOUR TRUCK<br>${esc(v.id)} is coming to take over the cargo. Keep it sealed.` };
        R.push({
          id: 'nearest', icon: '📍🚚', action: `Reassign nearest truck ${v.id}`,
          reason: `${v.id} is at ${v.loc}, at the end of ${v.route}, only ${dist} km from the problem`,
          delay, cost: costFor(dist, 100), risk: pend ? 'MEDIUM' : 'LOW', veh: v.id, takeAll: true,
          note: pend ? `${plural(pend, 'delivery')} of ${v.id} on ${v.route} must be handed over first; its customers are told` : '', drv,
          steps: [
            `Call ${v.driver} (${v.id}) and confirm it has finished or can hand over its own drops first${pend ? ' (' + pend + ' pending)' : ''}.`,
            `Send it to ${where}: ${dist} km away, ETA about +${fmt(delay)}.`,
            `If its own drops shift, tell those customers before dispatching.`,
            `Hand over documents and seals, then send the customer messages below.`],
          caution: `Do not strip another customer's delivery of its truck without telling them first.`
        });
      }
    }

    /* 5 ── Split the load by priority */
    const rest = ds.filter(x => urg(x) < 2);
    if (urgent.length && rest.length) {
      const t = S.veh.filter(x => !busy.has(x.id) && x.status == 'AVAILABLE' && free(x) >= PARCEL)
        .sort((p, q) => km(p.loc, where) - km(q.loc, where) || free(q) - free(p))[0];
      if (t) {
        const n = Math.min(urgent.length, Math.floor(free(t) / PARCEL));
        const moved = urgent.slice(0, n), held = ds.filter(x => !moved.includes(x)), delay = leg(t.loc, where, 15, 30);
        R.push({
          id: 'split', icon: '✂️', action: `Send urgent ${idsOf(moved)} first on ${t.id}`,
          reason: `${t.id} has ${free(t)}% free space: urgent consignments go first, the rest are rescheduled`,
          delay, cost: costFor(km(t.loc, where), 150), risk: 'MEDIUM', veh: t.id, moved: sOf(moved), held: sOf(held),
          note: `Rescheduled: ${idsOf(held)} (about +${fmt(120)})`,
          drv: { [t.id]: { c: 'go', t: `✂️ PRIORITY RUN<br>Go to ${esc(where)}, pick up ${idsOf(moved)} and deliver them first.` } },
          steps: [
            `Pick the urgent consignments: ${idsOf(moved)} (highest priority first).`,
            `Move them onto ${t.id} (${free(t)}% free): at the stuck truck if already on the road, or at the depot if not yet dispatched.`,
            `Reschedule the rest (${idsOf(held)}), apologise and give each customer a new slot.`,
            `Dispatch ${t.id} and send the customer messages below.`],
          caution: `Never reschedule a CRITICAL consignment to make room; if space is short, send the most critical first.`
        });
      }
    }

    /* 6 ── Hire a local carrier (when no company truck is free, or a critical delivery needs a backup) */
    const company = R.some(r => ['assign', 'nearest', 'transfer', 'split'].includes(r.id));
    if (ds.length && !['TRAFFIC', 'WEATHER'].includes(T) && (!company || topU == 3)) {
      const cost = 600 + Math.round((+rt.km || 0) * 6), drv = {};
      im.vehicles.forEach(v => drv[v.id] = { c: 'warn', t: `🚛 CARRIER BEING BOOKED<br>Stay with the cargo. Hand it over only when the control center confirms.` });
      R.push({
        id: 'carrier', icon: '🚛', action: `Hire a local carrier (${plural(ds.length, 'consignment')})`,
        reason: company ? 'Backup for critical consignments if company trucks run late' : 'No company truck is free: a vetted local carrier can take the load',
        delay: 60, cost, risk: 'MEDIUM', drv,
        steps: [
          `Call 2–3 approved local carriers; get the price (about ₹${cost}), pickup ETA and vehicle type.`,
          `Check insurance, driver ID and vehicle number; share the consignment list and e-way bills.`,
          `Make sure the carrier returns proof of delivery (photo or signature) for every drop.`,
          `Keep the original driver with the cargo until the carrier arrives, then send the customer messages below.`],
        caution: `Most expensive option; use vetted partners only, and not for temperature-controlled goods.`
      });
    }

    /* 7 ── Hold and notify (short disruptions) */
    if (['TRAFFIC', 'WEATHER', 'OTHER', 'DELIVERY_CHANGE'].includes(T) || d.severity == 'LOW') {
      const drv = {};
      im.vehicles.forEach(v => drv[v.id] = { c: 'warn', t: `⏳ HOLD POSITION<br>Park safely and wait. Control center will update you.` });
      R.push({
        id: 'hold', icon: '⏳', action: `Hold position and notify ${plural(im.customers.length, 'customer')}`,
        reason: 'Short disruption: waiting is often faster than swapping trucks. Customers are warned now',
        delay: im.delay, cost: 0, risk: topU >= 2 ? 'MEDIUM' : 'LOW', drv,
        steps: [
          `Tell the drivers to hold position safely (park, stay with the vehicle).`,
          `Send the customer messages below now, with the possible delay of about ${fmt(im.delay)}.`,
          `Check the traffic or weather status every 20–30 minutes.`,
          `When it clears, press “Disruption cleared” to release the deliveries. If it lasts over 2 hours, pick another option.`],
        caution: `Not suitable when a CRITICAL delivery cannot wait: switch to reroute, transfer or a carrier.`
      });
    }

    /* 8 ── Customer pickup / hub handover (small urgent orders) */
    if (urgent.length && where) {
      const elig = urgent.filter(x => km(cityOf(cu(x.cust).address), where) <= 60).slice(0, 3);
      if (elig.length) {
        const far = Math.max(...elig.map(x => km(cityOf(cu(x.cust).address), where))), delay = Math.max(30, far + 15), drv = {};
        able.forEach(v => drv[v.id] = { c: 'go', t: `📍 HUB HANDOVER<br>Take ${idsOf(elig)} to our ${esc(where)} hub. Customers will collect there.` });
        if (brk) drv[brk.id] = { c: 'warn', t: `⚠️ STAY WITH YOUR TRUCK<br>Cargo ${idsOf(elig)} will be collected at the ${esc(where)} hub. Wait for instructions.` };
        const others = ds.filter(x => !elig.includes(x));
        R.push({
          id: 'hub', icon: '📍', action: `Hub pickup at ${where} for ${idsOf(elig)}`,
          reason: `${plural(elig.length, 'urgent order')}: customers within ${far} km can collect from our ${where} hub`,
          delay, cost: 100, risk: 'MEDIUM', hub: where, moved: sOf(elig), drv,
          note: others.length ? `Other consignments (${idsOf(others)}) stay delayed by about ${fmt(im.delay)}` : '',
          steps: [
            `Confirm our (or a partner) hub at ${where} is open and can hold the parcels.`,
            `Call each customer (${[...new Set(elig.map(x => x.cust))].join(', ')}): agree a pickup time, share the hub address and the ID / OTP needed.`,
            `Move the parcels to the hub with a truck that can reach it.`,
            `At collection check the ID or OTP and take a signature or photo; mark the delivery as completed.`],
          caution: `Only for small, urgent orders and only if the customer agrees; always keep proof of handover.`
        });
      }
    }

    /* 9 ── Reschedule the least urgent delivery (fallback) */
    if (ds.length) {
      const x = ds[ds.length - 1];
      R.push({
        id: 'resched', icon: '⏰', action: `Reschedule Delivery ${x.id}`, reason: 'Fallback when no vehicle option is available',
        delay: Math.max(120, Math.ceil((im.delay + 30) / 60) * 60) + 60 * Math.floor(S.del.filter(y => y.status == 'RESCHEDULED').length / 5), cost: 0, risk: 'MEDIUM', del: x.id,
        steps: [`Offer the customer of ${x.id} a new slot and confirm it.`, `Keep the other deliveries on schedule and send the customer messages below.`],
        caution: `Reschedule only the least urgent delivery; never a CRITICAL one.`
      });
    }
    if (!R.length) R.push({ id: 'monitor', icon: '👁️', action: 'Monitor and notify customers', reason: 'No affected deliveries or alternatives found', delay: im.delay, cost: 0, risk: 'LOW', steps: ['Keep watching the route and update customers if anything changes.'] });

    R.forEach(r => { const b = topU >= 2 && !['resched', 'hold', 'monitor'].includes(r.id) ? 8 : 0; r.calc = `100 − ${Math.round(r.delay / cfg().wd)} (delay) − ${Math.round(r.cost / cfg().wc)} (cost) − ${RK[r.risk] * 10} (risk)` + (b ? ' + 8 (urgent delivery)' : ''); r.score = Math.max(0, Math.min(100, Math.round(100 - r.delay / cfg().wd - r.cost / cfg().wc - RK[r.risk] * 10 + b))); });
    R.sort((p, q) => q.score - p.score);
    R[0].best = true;
    return R;
  }

  /* ======================= CUSTOMER MESSAGES ======================= */
  function custMsg(r, name) {
    const d = cur.d, mine = cur.im.deliveries.filter(x => x.cust == name);
    const di = idsOf(mine) || '(your delivery)', why = tname(d.type) + ' on ' + d.route, hi = 'Hello ' + name + ', ', sign = ' – RoutePilot';
    const mv = r.moved || [], inM = mine.filter(x => mv.includes(x.id));
    switch (r.id) {
      case 'reroute': return `${hi}there is a ${why}. Your delivery ${di} is being rerouted ${r.via}. New delay: about ${fmt(r.delay)}. We will keep you updated.${sign}`;
      case 'assign': case 'nearest': return `${hi}because of a ${why}, your delivery ${di} will continue on a replacement truck (${r.veh}). Expected delay: about ${fmt(r.delay)}.${sign}`;
      case 'transfer': return inM.length
        ? `${hi}because of a ${why}, your delivery ${idsOf(inM)} is being moved to another truck (${r.veh}). Expected delay: about ${fmt(r.delay)}.${sign}`
        : `${hi}because of a ${why}, your delivery ${di} is delayed and will be rescheduled. We will confirm the new time shortly. Sorry for the trouble.${sign}`;
      case 'split': return inM.length
        ? `${hi}your urgent delivery ${idsOf(inM)} is being sent ahead on a separate truck. Expected delay: about ${fmt(r.delay)}.${sign}`
        : `${hi}to make room for urgent orders after a ${why}, your delivery ${di} has been rescheduled. We will confirm the new slot shortly. Sorry for the trouble.${sign}`;
      case 'carrier': return `${hi}after a ${why}, a local carrier partner will deliver ${di}. Expected delay: about ${fmt(r.delay)}. Carrier details will follow.${sign}`;
      case 'hold': return `${hi}your delivery ${di} may be delayed by about ${fmt(r.delay)} due to a ${why}. The truck is holding safely and we will update you as soon as it moves.${sign}`;
      case 'hub': return inM.length
        ? `${hi}your delivery ${idsOf(inM)} can be collected from our ${r.hub} hub. Please reply with a time that suits you and carry an ID.${sign}`
        : `${hi}your delivery ${di} is delayed by about ${fmt(cur.im.delay)} due to a ${why}. We will update you shortly.${sign}`;
      case 'resched': return mine.some(x => x.id == r.del)
        ? `${hi}your delivery ${r.del} has been rescheduled because of a ${why}. We will confirm the new slot shortly. Sorry for the trouble.${sign}`
        : `${hi}there is a ${why} on your route, but your delivery ${di} continues on schedule.${sign}`;
      default: return `${hi}there is a ${why}. Your delivery ${di} may be affected; we are monitoring it.${sign}`;
    }
  }

  /* ======================= APPLY THE CHOSEN OPTION ======================= */
  function applyOption(id) {
    const r = cur.recs.find(x => x.id == id), d = cur.d, im = cur.im;
    if (!r) return;
    L('✅ Operator approved: ' + r.action);
    const dels = im.deliveries;
    const set = (x, status, plan, delay2) => {
      x.status = status;
      x.issue = Object.assign(x.issue || { type: d.type, route: d.route, time: d.time, delay: im.delay }, { plan, delay2, upd: now() });
    };
    const take = (list, vid) => list.forEach(i => { const x = S.del.find(q => q.id == i); if (x) x.veh = vid; });
    const allIds = dels.map(x => x.id);

    switch (r.id) {
      case 'reroute':
        (r.vehs || []).forEach(i => { const v = V_(i); if (v && r.to) v.route = r.to; });
        dels.forEach(x => set(x, 'ON_TIME', r.action, r.delay));
        break;
      case 'assign': case 'nearest': {
        const v = V_(r.veh); v.status = 'IN_TRANSIT'; v.route = d.route;
        if (r.takeAll) take(allIds, v.id);
        dels.forEach(x => set(x, 'ON_TIME', r.action, r.delay));
        break;
      }
      case 'transfer': {
        const h = V_(r.veh), b = V_(r.from);
        take(r.moved, h.id);
        h.cap = Math.min(100, (+h.cap || 0) + r.load); b.cap = Math.max(0, (+b.cap || 0) - r.load);
        dels.forEach(x => r.moved.includes(x.id)
          ? set(x, 'ON_TIME', `Cargo moved to truck ${h.id}`, r.delay)
          : set(x, 'RESCHEDULED', 'Waiting for a recovery truck: delivery rescheduled', 120));
        break;
      }
      case 'split': {
        const t = V_(r.veh); t.status = 'IN_TRANSIT'; t.route = d.route; t.cap = Math.min(100, (+t.cap || 0) + r.moved.length * PARCEL);
        take(r.moved, t.id);
        dels.forEach(x => r.moved.includes(x.id)
          ? set(x, 'ON_TIME', `Sent ahead on truck ${t.id}`, r.delay)
          : set(x, 'RESCHEDULED', 'Rescheduled so urgent consignments could go first', 120));
        break;
      }
      case 'carrier':
        dels.forEach(x => { x.carrier = true; set(x, 'ON_TIME', 'A local carrier has been booked to deliver this', r.delay); });
        break;
      case 'hold':
        dels.forEach(x => set(x, 'DELAYED', 'Holding until the disruption clears. We will update you', im.delay));
        break;
      case 'hub':
        dels.forEach(x => r.moved.includes(x.id)
          ? (x.hub = { city: r.hub, at: Date.now() }, set(x, 'HUB_PICKUP', `Collect from our ${r.hub} hub. We will call you`, r.delay))
          : set(x, 'DELAYED', 'Delayed: the truck continues once the route clears', im.delay));
        break;
      default: /* resched */
        dels.forEach(x => { const me = x.id == r.del; set(x, me ? 'RESCHEDULED' : 'ON_TIME', me ? r.action : 'Another delivery on this route was rescheduled, so yours continues on schedule', me ? r.delay : 0); });
    }

    const rr = S.routes.find(x => x.id == d.route);
    if (r.id != 'hold') { if (!r.to && rr.status != 'BLOCKED') rr.status = 'SLOW'; d.active = false; }
    cur.done = true; cur.applied = r; cur.chk = {};
    AU('approved plan "' + r.action + '" on ' + d.route);
    resInc(d, r);
    L('🔄 Routes updated — delay ' + fmt(im.delay) + ' → ' + fmt(r.delay));
    save(); go('impact');
  }

  /* “Hold and notify” → release when the problem is over */
  function holdRelease() {
    if (!cur || !cur.applied || cur.applied.id != 'hold') return;
    const d = cur.d;
    d.active = false;
    cur.im.deliveries.forEach(x => {
      if (x.status == 'DELAYED') x.status = 'ON_TIME';
      x.issue = Object.assign(x.issue || {}, { plan: 'Disruption cleared: your delivery continues', delay2: 0, upd: now() });
    });
    const rr = S.routes.find(x => x.id == d.route);
    if (rr && !S.dis.some(q => q.active && q.route == d.route)) rr.status = 'CLEAR';
    cur.applied = Object.assign({}, cur.applied, { released: true, drv: {} });
    AU('released hold on ' + d.route + ' (disruption cleared)'); L('✅ Disruption cleared on ' + d.route);
    save(); go('impact');
  }

  function copyMsg(btn, enc) {
    const t = decodeURIComponent(enc), done = () => { const o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = o, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, done); else done();
  }

  /* ======================= IMPACT & PLAN PAGE ======================= */
  function optionCard(r, i, im) {
    const drv = Object.keys(r.drv || {});
    return `<div class="rec ${r.best ? 'best' : ''}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>OPTION ${i + 1} · ${r.icon} ${esc(r.action)}</b>${r.best ? '<span class="tag">AI RECOMMENDED</span>' : ''}</div>`
      + `<div style="color:var(--mut)">${esc(r.reason)}</div>`
      + `<div style="margin:6px 0">Delay: <b>+${fmt(r.delay)}</b> · Cost: <b>₹${r.cost || 0}</b> · Risk ${B(r.risk)} · Score <b>${r.score}</b></div><div style='color:var(--mut);font-size:12px'>Score = ${esc(r.calc || '')}</div>`
      + (r.note ? `<div style="color:var(--mut);font-size:13px;margin-bottom:4px">ℹ️ ${esc(r.note)}</div>` : '')
      + `<details><summary>How to carry this out</summary><ol>${(r.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol>${r.caution ? `<div class="caut">⚠️ ${esc(r.caution)}</div>` : ''}</details>`
      + `<details><summary>Messages that will go out</summary>${drv.length ? `<p><b>Drivers:</b></p><ul>${drv.map(k => { const v = V_(k); return `<li>${esc(k)}${v ? ' (' + esc(v.driver) + ')' : ''}: ${r.drv[k].t.replace(/<br>/g, ' ')}</li>`; }).join('')}</ul>` : ''}`
      + `<p><b>Customer message (example):</b><br><span style="color:var(--mut)">${esc(custMsg(r, im.customers[0] || ''))}</span></p></details>`
      + `<button onclick="apply('${r.id}')">${r.best ? 'APPLY NEW PLAN' : 'SELECT'}</button></div>`;
  }

  function appliedBlock(a, im, d) {
    const v = im.vehicles[0], diff = im.delay - a.delay;
    const diffTxt = diff > 0 ? `Delay reduced by <b>${fmt(diff)}</b>.` : diff == 0 ? 'Delay stays the same, but customers are informed.' : `Delay increases by <b>${fmt(-diff)}</b> for the handled consignments.`;
    let h = `<h3 style="margin:16px 0 8px">✅ New plan applied: ${esc(a.action)}</h3><div class="ba"><div class="old"><b>ORIGINAL PLAN</b><p>${v ? v.id : ''} on ${d.route}<br>${im.customers.slice(0, 3).map(esc).join(' → ')}</p><p>Original delay<br><b style="font-size:24px;color:var(--red)">${fmt(im.delay)}</b></p></div>`
      + `<div class="new"><b>NEW PLAN</b><p>${a.to ? `${esc(a.veh)} on ${a.to}` : esc(a.action)}<br>${im.customers.slice(0, 3).map(esc).join(' → ')}</p><p>New delay<br><b style="font-size:24px;color:var(--grn)">${fmt(a.delay)}</b></p></div></div>`
      + `<p>${diffTxt} Dashboard updated.</p>${a.note ? `<p style="color:var(--mut)">ℹ️ ${esc(a.note)}</p>` : ''}`;
    if (a.id == 'hold' && d.active) h += `<div class="card" style="border-color:var(--amb)"><b>⏳ Holding.</b> When the road, weather or traffic is back to normal, release the deliveries.<br><button style="margin-top:8px" onclick="holdRelease()">DISRUPTION CLEARED · RELEASE</button></div>`;
    if (a.released) h += `<div class="ban ok" style="margin-top:10px">✅ Disruption cleared. Deliveries are back on schedule.</div>`;

    cur.chk = cur.chk || {};
    h += `<h3 style="margin:16px 0 8px">📋 Next steps</h3><div class="card">${(a.steps || []).map((s, i) => `<label class="chk ${cur.chk[i] ? 'dn' : ''}"><input type="checkbox" ${cur.chk[i] ? 'checked' : ''} onchange="cur.chk[${i}]=this.checked;this.parentElement.classList.toggle('dn',this.checked)"> ${esc(s)}</label>`).join('')}${a.caution ? `<div class="caut">⚠️ ${esc(a.caution)}</div>` : ''}</div>`;

    const dk = Object.keys(a.drv || {});
    if (dk.length) h += `<h3 style="margin:16px 0 8px">🚚 Driver instructions</h3><div class="card">${dk.map(k => { const w = V_(k); return `<p style="margin:6px 0"><b>${esc(k)}${w ? ' · ' + esc(w.driver) : ''}</b><br><span style="color:var(--mut)">${a.drv[k].t.replace(/<br>/g, ' · ')}</span></p>`; }).join('')}<p style="color:var(--mut);font-size:13px;margin:6px 0 0">Drivers see this automatically in their app.</p></div>`;

    h += `<h3 style="margin:16px 0 8px">📣 Notify customers</h3>` + im.customers.map(n => {
      const c = cu(n), m = custMsg(a, n), enc = encodeURIComponent(m), ph = String(c.phone || '').replace(/[^\d+]/g, '');
      return `<div class="rec"><b>${esc(n)}</b> ${c.phone ? `<span style="color:var(--mut)">· ${esc(c.phone)}</span>` : ''}<div style="margin:6px 0;color:var(--mut)">${esc(m)}</div>`
        + `${ph ? `<a class="lk" href="sms:${ph}?body=${enc}">💬 SMS</a><a class="lk" href="tel:${ph}">📞 Call</a>` : ''}`
        + `<button class="ghost" style="padding:6px 10px" onclick="copyMsg(this,'${enc}')">📋 Copy</button></div>`;
    }).join('');
    return h;
  }

  function impactView2() {
    if (!cur) return `<div class="card"><h3>No active analysis</h3><p>When a driver reports a problem (or a disruption is simulated), the system shows what changed, what is affected, and what to do next. See the <b>Response Playbook</b> for all options.</p></div>`;
    const { d, im, recs } = cur;
    let h = `<div class="card" style="border-color:var(--red)"><h3>🚨 IMPACT DETECTED · ${d.route} ${B(im.severity)}</h3><div class="grid g4" style="margin-top:10px"><div class="kpi"><b>${im.vehicles.length}</b><span>Vehicles affected</span></div><div class="kpi"><b>${im.deliveries.length}</b><span>Deliveries affected</span></div><div class="kpi"><b>${im.customers.length}</b><span>Customers affected</span></div><div class="kpi"><b>${fmt(im.delay)}</b><span>Estimated delay</span></div></div><p style="color:var(--mut);margin:8px 0 0">${im.reasons.map(esc).join(' · ')}</p></div><h3 style="margin:16px 0 8px">Dependency: if this changes → these are affected</h3><div class="card">${flow()}</div>`;
    if (!cur.done) h += `<h3 style="margin:16px 0 4px">What should we do next? <span class="badge">AI-Assisted Recommendation</span></h3><p style="color:var(--mut);margin:0 0 10px;font-size:13px">${recs.length} options ranked by delay, cost and risk. Open “How to carry this out” on any option for the exact steps.</p>${recs.map((r, i) => optionCard(r, i, im)).join('')}`;
    else h += appliedBlock(cur.applied, im, d);
    return h;
  }

  /* ======================= RESPONSE PLAYBOOK PAGE ======================= */
  const PLAY = [
    { i: '🔄', n: 'Reroute via alternate road', what: 'Keep the same truck and load; send it on a different road.', use: 'Road closure, accident ahead, severe traffic or weather on the main road.', avoid: 'When the alternate road is also affected or has height/weight limits.', t: '+25–55 min · ₹0 (extra fuel/tolls)' },
    { i: '🔁', n: 'Transfer cargo to a nearby truck', what: 'Move the load from the stuck or broken truck onto a truck already close by on the same route.', use: 'Breakdown with another truck within about 120 km on the same route.', avoid: 'When the helper truck has no free space, or goods need special handling.', t: '+30–60 min · ~₹150' },
    { i: '📍🚚', n: 'Reassign the nearest truck', what: 'Send a truck from a nearby route that is close to finishing its own drops.', use: 'Truck cannot continue and no truck is on the same route.', avoid: 'When that truck still has many drops pending.', t: '+30–90 min · ~₹250' },
    { i: '🚚', n: 'Assign the depot truck', what: 'Dispatch the idle truck waiting at the depot.', use: 'No truck is closer than the depot.', avoid: 'When the depot is far from the problem.', t: '+40 min or more (distance based) · ₹450' },
    { i: '✂️', n: 'Split the load by priority', what: 'Send URGENT consignments first on whichever truck is free; reschedule only the low-priority ones.', use: 'Mix of urgent and normal consignments, and not enough capacity for all.', avoid: 'When every consignment is critical (nothing to reschedule).', t: '+30–60 min urgent · rest +2h · ~₹350' },
    { i: '🚛', n: 'Hire a local carrier', what: 'Book a vetted local transport partner to take the load.', use: 'No company truck is free, or a critical delivery needs a backup.', avoid: 'Cold-chain goods or unvetted vendors.', t: '+60 min · ₹600 + ₹6/km' },
    { i: '⏳', n: 'Hold and notify', what: 'Keep trucks safely parked and warn customers; release when it clears.', use: 'Short traffic or weather problems, small delivery changes.', avoid: 'When a critical delivery cannot wait or the problem will last over 2 hours.', t: 'Delay = the disruption itself · ₹0' },
    { i: '📍', n: 'Customer pickup / hub handover', what: 'Customer collects a small urgent order from our hub near the problem.', use: 'Small urgent orders whose customer is within about 60 km of the hub.', avoid: 'Large loads, or customers who cannot travel.', t: '+30–75 min · ~₹100' },
    { i: '⏰', n: 'Reschedule', what: 'Move the least urgent delivery to a new slot.', use: 'Last resort when no vehicle option fits.', avoid: 'Never for a CRITICAL delivery.', t: '+2 h · ₹0' }
  ];
  const MATRIX = [
    ['Road closure', 'Reroute → Split by priority → Hub handover → Hire carrier'],
    ['Accident', 'Reroute → Split by priority → Hub handover → Hire carrier'],
    ['Vehicle breakdown', 'Transfer cargo → Nearest truck → Assign depot truck → Hub handover → Hire carrier'],
    ['Bad weather', 'Reroute (if severe) → Hold and notify → Hub handover'],
    ['Traffic / delay', 'Hold and notify → Reroute (if severe)'],
    ['Delivery problem / other', 'Hold and notify → Nearest truck → Split by priority → Reschedule']
  ];
  const playbook = () => `<div class="card"><h3>Response Playbook</h3><p style="color:var(--mut);margin:6px 0 0">The system ranks these options automatically on the Impact &amp; Plan page. Use this guide to understand each one. Delay and cost figures are typical estimates.</p></div>`
    + `<h3 style="margin:16px 0 8px">Which option for which situation</h3><div class="card scroll"><table><thead><tr><th>Situation</th><th>Usual order of options</th></tr></thead><tbody>${MATRIX.map(r => `<tr><td><b>${r[0]}</b></td><td style="white-space:normal">${r[1]}</td></tr>`).join('')}</tbody></table></div>`
    + `<h3 style="margin:16px 0 8px">The options</h3><div class="grid g2">${PLAY.map(p => `<div class="card"><b>${p.i} ${p.n}</b><p style="margin:6px 0">${p.what}</p><p style="margin:4px 0"><b>Use when:</b> <span style="color:var(--mut)">${p.use}</span></p><p style="margin:4px 0"><b>Avoid when:</b> <span style="color:var(--mut)">${p.avoid}</span></p><p style="margin:4px 0"><b>Typical:</b> <span style="color:var(--mut)">${p.t}</span></p></div>`).join('')}</div>`
    + `<h3 style="margin:16px 0 8px">Golden rules</h3><div class="card"><ol style="margin:0 0 0 18px;padding:0"><li>Protect CRITICAL consignments first.</li><li>Tell customers early, with a real time and a reason.</li><li>Confirm the driver has read the new instruction.</li><li>Always keep proof: transfer note, hub handover signature, carrier proof of delivery.</li><li>Re-check every 30 minutes; change the plan if conditions change.</li></ol></div>`;

  /* ======================= CONTACT DIRECTORY ======================= */
  function contactSMS(phone,name,role){
    const p=String(phone||'').replace(/\s+/g,'');
    if(!p)return '';
    const msg=encodeURIComponent(`Hello ${name}, this is a RoutePilot contact message.`);
    return `<a class="sms" href="sms:${p}?body=${msg}">💬 SMS</a>`;
  }
  function contactCard(icon,roleName,name,phone,email,extra){
    const p=String(phone||'').trim();
    return `<div class="contact-card">
      <div class="contact-role">${icon} ${esc(roleName)}</div>
      <div class="contact-name">${esc(name||roleName)}</div>
      ${extra?`<div class="contact-meta">${esc(extra)}</div>`:''}
      <div class="contact-meta">📞 ${p?`<a href="tel:${p.replace(/[^+\d]/g,'')}" style="color:var(--acct);font-weight:800;text-decoration:none">${esc(p)}</a>`:'Phone number not added'}</div>
      ${email?`<div class="contact-meta">✉️ ${esc(email)}</div>`:''}
      ${p?`<div class="contact-actions"><a class="call" href="tel:${p.replace(/[^+\d]/g,'')}">📞 Call</a>${contactSMS(p,name||roleName,roleName)}</div>`:''}
    </div>`;
  }
  function contacts(){
    const ops=ACC.ops||[], drivers=S.veh||[], owner=ACC.owner||{};
    return `<div class="top"><div><h3>Contact Directory</h3><p style="color:var(--mut);margin:4px 0 0">Quickly contact the people responsible for operations and delivery recovery.</p></div></div>
      <div class="card" style="margin-bottom:14px;border-color:var(--acc)"><b>📞 Emergency / Operations Contacts</b><p style="color:var(--mut);margin:5px 0 0">Use Call or normal SMS when a disruption needs immediate coordination.</p></div>
      <h3 style="margin:16px 0 8px">👑 Owner</h3><div class="contact-grid">${contactCard('👑','Owner',owner.name||'RoutePilot Owner',owner.phone,owner.email,'System administrator')}</div>
      <h3 style="margin:18px 0 8px">🖥️ Operators</h3><div class="contact-grid">${ops.length?ops.map(o=>contactCard('🖥️','Operator',o.name||o.id,o.phone,o.email,o.id)).join(''):'<div class="contact-empty">No operators found.</div>'}</div>
      <h3 style="margin:18px 0 8px">🚚 Drivers</h3><div class="contact-grid">${drivers.length?drivers.map(v=>contactCard('🚚','Driver',v.driver||v.id,v.phone,v.email,`${v.id} · ${v.route||'No route'} · ${v.status||'Unknown'}`)).join(''):'<div class="contact-empty">No drivers found.</div>'}</div>
      <div class="card contact-note">Numbers are stored in the current browser data. Replace the blank phone fields with your real Owner, Operator and Driver numbers before the demo.</div>`;
  }
  V.contacts=contacts;
  PG.contacts='📞 Contacts';
  Object.keys(NAVS).forEach(k=>{
    if(!NAVS[k].includes('contacts')){
      if(k=='ow') NAVS[k].push('contacts');
      else if(k=='op') NAVS[k].push('contacts');
      else if(k=='drv') NAVS[k].push('contacts');
      else if(k=='cu') NAVS[k].push('contacts');
    }
  });

  /* ======================= DRIVER BANNER ======================= */
  function dBanner() {
    const mine = cur && cur.im.vehicles.some(x => x.id == ME);
    if (cur && cur.done) {
      const a = cur.applied, m = a.drv && a.drv[ME];
      if (a.released && mine) return `<div class="ban ok">✅ Disruption cleared.<br>Continue your trip. Drive safe.</div>`;
      if (m) return `<div class="ban ${m.c}">${m.t}</div>`;
      if (mine) return `<div class="ban go">✅ Control center decided: ${esc(a.action)}.<br>Follow their instructions.</div>`;
    }
    if (cur && !cur.done && mine) return `<div class="ban warn">⚠️ Problem on your route (${cur.d.route}).<br>Control center is working on it. Stay safe and wait for instructions.</div>`;
    return `<div class="ban ok">✅ No issues on your route. Drive safe.</div>`;
  }

  /* ======================= WIRE EVERYTHING IN ======================= */
  window.recommend = recommend;
  window.apply = applyOption;
  window.holdRelease = holdRelease;
  window.copyMsg = copyMsg;
  window.dBanner = dBanner;
  V.impact = impactView2;
  V.playbook = playbook;
  PG.playbook = 'Response Playbook';
  ['op', 'ow'].forEach(k => {
    if (!NAVS[k].includes('playbook')) {
      const at = NAVS[k].indexOf(k == 'op' ? 'impact' : 'analytics');
      NAVS[k].splice(at + 1, 0, 'playbook');
    }
  });
})();
</script>

<script>
/* ---- Judges' fixes: settings, duplicate reports, false-report review, truck conflicts, login lockout, real-map option ---- */
(function(){
const DEF={speed:50,costKm:18,buffer:15,wd:3,wc:25};
window.cfg=()=>Object.assign({},DEF,(ACC&&ACC.cfg)||{});
const claimed=v=>v.claim&&Date.now()-(v.claimAt||0)<1800000;
const how=()=>{const c=cfg();return`<p style="color:var(--mut)">Transparent rule-based scoring, not machine learning. Every option gets:</p><p><code>score = 100 − delay/${c.wd} − cost/${c.wc} − risk×10 (+8 if a HIGH or CRITICAL delivery is affected)</code></p><ul><li><b>Reroute:</b> extra km ÷ ${c.speed} km/h + ${c.buffer} min to brief drivers. Cost = extra km × ₹${c.costKm} per truck. Offered only if the alternative route is not BLOCKED or DISRUPTED.</li><li><b>Truck options:</b> delay and cost come from the road distance to the problem (₹${c.costKm}/km plus a base fee).</li><li><b>Reschedule:</b> next free hourly slot (5 deliveries per slot).</li><li><b>Conflicts:</b> a truck already given to another plan is hidden and the options are recalculated.</li><li>The operator always approves, and the audit log records who approved what.</li></ul><p style="color:var(--mut)">Speed, ₹/km, buffer and the weights are assumptions the owner can change in Settings and replace with real fleet data.</p>`};
/* duplicate reports + remember previous state so a false report can be undone */
const _nd=window.newDis;
window.newDis=function(type,route,sev,extra){
  const dup=S.dis.find(x=>x.active&&x.route==route&&x.type==type&&(type!='VEHICLE_BREAKDOWN'||x.vehicle==(extra&&extra.vehicle)));
  if(dup){dup.reports=(dup.reports||1)+1;L('➕ Another driver confirmed the report on '+route+' ('+dup.reports+' reports)');AU('confirmed existing '+type.replace(/_/g,' ').toLowerCase()+' on '+route);save();if(role=='drv'){dsent={photo:photoOK,dup:true};dRender()}else go(page);return}
  const rt=S.routes.find(r=>r.id==route),pv=rt&&rt.status,vh=extra&&extra.vehicle?S.veh.find(v=>v.id==extra.vehicle):null,pvs=vh&&vh.status;
  _nd(type,route,sev,extra);
  if(cur&&cur.d){cur.d.reports=1;cur.d.prev={route:pv,veh:pvs};save()}
};
window.dismissDis=function(id){const d=S.dis.find(x=>x.id==id);if(!d||!d.active)return;d.active=false;d.dismissed=true;
  const rt=S.routes.find(r=>r.id==d.route);if(rt&&d.prev&&d.prev.route)rt.status=d.prev.route;
  if(d.type=='VEHICLE_BREAKDOWN'&&d.vehicle&&d.prev&&d.prev.veh){const v=S.veh.find(x=>x.id==d.vehicle);if(v)v.status=d.prev.veh}
  S.del.forEach(x=>{if(x.issue&&x.issue.route==d.route&&x.issue.time==d.time){if(x.status=='AT_RISK')x.status='ON_TIME';delete x.issue}});
  AU('dismissed '+d.type.replace(/_/g,' ').toLowerCase()+' report on '+d.route+' as false or mistaken');L('🚫 Report on '+d.route+' dismissed as false or mistaken');cur=null;save();go('impact')};
/* truck conflicts: hide trucks promised to another plan, and re-check at approval time */
const _rc=window.recommend;
window.recommend=function(d,im){const hid=S.veh.filter(v=>claimed(v)&&v.claim!=d.id&&v.status!='BREAKDOWN'),old=hid.map(v=>v.status);hid.forEach(v=>v.status='OFFLINE');try{return _rc(d,im)}finally{hid.forEach((v,i)=>v.status=old[i])}};
const _ap=window.apply;
window.apply=function(id){const r=cur&&cur.recs.find(x=>x.id==id);
  if(r&&['assign','nearest','split','transfer'].includes(r.id)&&r.veh){const v=S.veh.find(x=>x.id==r.veh);
    if(v&&claimed(v)&&v.claim!=cur.d.id){cur.recs=recommend(cur.d,cur.im);cur.note='Truck '+v.id+' was already assigned to another plan, so the options were recalculated.';go('impact');return}
    if(v){v.claim=cur.d.id;v.claimAt=Date.now()}}
  if(cur)delete cur.note;_ap(id)};
/* impact page: report review, conflict note, "how it works" */
const _vi=V.impact;
V.impact=function(){let h=_vi();
  if(cur&&cur.d){const d=cur.d,n=d.reports||1;
    const note=cur.note?`<div class="ban warn">${esc(cur.note)}</div>`:'';
    const rev=(!cur.done&&d.active)?`<div class="card" style="margin-top:14px"><h3>Report review</h3><p style="color:var(--mut);margin:6px 0">${n>1?`✅ Confirmed by ${n} reports from drivers.`:'⚠️ Single unconfirmed report. Check with the driver before approving a plan.'}</p><button class="ghost" onclick="dismissDis('${d.id}')">🚫 Dismiss as false or mistaken report</button></div>`:'';
    h=note+h+rev}
  return h+`<details class="card" style="margin-top:14px"><summary style="cursor:pointer;font-weight:700">How is the best option chosen?</summary>${how()}</details>`};
/* owner settings */
PG.settings='Settings';if(NAVS.ow&&!NAVS.ow.includes('settings'))NAVS.ow.push('settings');
V.settings=()=>{const c=cfg();return`<h3 style="margin-bottom:10px">Recommendation settings</h3><div class="card" style="max-width:520px"><p style="color:var(--mut)">These numbers drive the delay, cost and score of every recommendation.</p>${[['speed','Average truck speed (km/h)'],['costKm','Operating cost (₹ per km)'],['buffer','Driver briefing buffer (min)'],['wd','Delay weight (higher = delay matters less)'],['wc','Cost weight (higher = cost matters less)']].map(f=>`<label>${f[1]}</label><input id="cf_${f[0]}" type="number" min="1" value="${c[f[0]]}">`).join('')}<div id="cfm" class="err"></div><button onclick="saveCfg()">SAVE SETTINGS</button></div><details class="card" style="margin-top:14px" open><summary style="cursor:pointer;font-weight:700">How the best option is chosen</summary>${how()}</details>`};
window.saveCfg=()=>{if(role!='ow')return;const o={};for(const k of Object.keys(DEF)){const v=Number($('#cf_'+k).value);if(!(v>0)){$('#cfm').textContent='All values must be greater than 0.';return}o[k]=v}ACC.cfg=o;AU('changed recommendation settings');save();go('settings')};
/* login lockout after 5 wrong attempts */
const LK={},_dl=window.doLogin;
window.doLogin=async function(){const u=(($('#lu')||{}).value||'').trim().toLowerCase(),k=lt+':'+u,f=LK[k]||(LK[k]={n:0,until:0});
  if(f.until>Date.now()){$('#lerr').textContent='Too many wrong attempts. Try again in '+Math.ceil((f.until-Date.now())/1000)+' s.';return}
  await _dl();const m=$('#lerr');
  if(U){f.n=0}else if(m&&/Incorrect/.test(m.textContent)){f.n++;if(f.n>=5){f.until=Date.now()+60000;f.n=0;m.textContent='Too many wrong attempts. Locked for 60 seconds.'}}};
/* optional real map (works when the file is hosted on your own site) */
const _vm=V.map;
V.map=function(){return`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center"><button class="ghost" onclick="realMap()">🗺️ Show real map (OpenStreetMap)</button><span id="rmmsg" style="color:var(--mut)"></span></div><div id="mapbox">${_vm()}</div>`};
window.realMap=function(){const m=$('#rmmsg');m.textContent='Loading map…';
  const draw=()=>{const LF=window.L;$('#mapbox').innerHTML='<div id="lmap" style="height:480px;border-radius:14px"></div>';
    const CITY={Coimbatore:[11.0168,76.9558],Tiruppur:[11.1085,77.3411],Erode:[11.341,77.7172],Salem:[11.6643,78.146],Chennai:[13.0827,80.2707],Bengaluru:[12.9716,77.5946],Perundurai:[11.2755,77.58]},nm=c=>String(c||'').replace(/\s*\(.*\)/,'').trim(),COL={CLEAR:'#35d07f',SLOW:'#ffb23e',DISRUPTED:'#ff8a3e',BLOCKED:'#ff5d5d'};
    const map=LF.map('lmap').setView([11.9,78.2],7);LF.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);
    S.routes.forEach(r=>{const a=CITY[nm(r.from)],b=CITY[nm(r.to)];if(a&&b)LF.polyline([a,b],{color:COL[r.status]||COL.CLEAR,weight:5,dashArray:r.status=='BLOCKED'?'10 8':null}).addTo(map).bindTooltip(r.id+' · '+r.status)});
    S.veh.forEach(v=>{const p=CITY[nm(v.loc)];if(p)LF.circleMarker(p,{radius:7,color:'#0a0e0c',fillColor:v.status=='BREAKDOWN'?'#ff5d5d':'#a8ff3e',fillOpacity:1}).addTo(map).bindTooltip(v.id+' · '+v.driver)})};
  if(window.L&&window.L.map)return draw();
  const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);
  const sc=document.createElement('script');sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';sc.onload=draw;sc.onerror=()=>{m.textContent='The real map is not available here because outside scripts are blocked. Host this file on your own site to use it.'};document.head.appendChild(sc)};
})();
</script>

<script>
/* ---- Customer "Your delivery team" (driver + operator numbers) and driver live-location sharing ---- */
(function(){
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tel=p=>String(p||'').replace(/[^+\d]/g,'');
const FRESH=120000;
const ago=t=>{const s=Math.max(0,Math.round((Date.now()-t)/1000));return s<60?s+' s ago':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'};
const gpsOK=v=>!!(v&&v.gps&&typeof v.gps.lat=='number'&&typeof v.gps.lng=='number');
const live=v=>!!(v&&v.share&&gpsOK(v)&&Date.now()-v.gps.t<FRESH);
const mapsUrl=g=>'https://www.google.com/maps?q='+g.lat+','+g.lng;

/* ===== Driver side: share live location (asks the browser for permission) ===== */
let W=null,lastSave=0,gerr='';
const me=()=>S.veh.find(x=>x.id==ME);
function gstatus(){const v=me();if(!v)return'';if(gerr)return gerr;
  if(W!==null&&v.share)return gpsOK(v)?'Sharing live location. Last update '+ago(v.gps.t)+'.':'Sharing is ON. Waiting for your first GPS fix…';
  return 'Location sharing is off.'}
function gcard(){const v=me(),on=W!==null&&!!(v&&v.share);
  return `<div class="drow" style="border:0;padding:0"><b>📍 Share my live location</b><span class="badge ${on?'CLEAR':''}">${on?'ON':'OFF'}</span></div>
<p id="gshS" style="color:var(--mut);margin:6px 0 10px">${e(gstatus())}</p>
<button style="width:100%" class="${on?'ghost':''}" onclick="geoToggle()">${on?'⏹ Stop sharing':'▶ Start sharing location'}</button>
<p style="color:var(--mut);font-size:12px;margin:8px 0 0">Customers with an open delivery on your truck can see your position while this is ON. It stops when you tap Stop or log out. Keep this page open while driving.</p>`}
function paint(){const b=document.getElementById('gshBox');if(b)b.innerHTML=gcard()}
function stopGeo(manual){if(W!==null){try{navigator.geolocation.clearWatch(W)}catch(_){}W=null}
  const v=me();if(v){v.share=false;delete v.gps;if(manual){try{L('📍 '+v.driver+' ('+v.id+') stopped sharing live location')}catch(_){}}}
  if(manual)gerr='';save();paint()}
function startGeo(){const v=me();if(!v)return;gerr='';
  if(!navigator.geolocation){gerr='This browser cannot share location. Try Chrome or Safari.';return paint()}
  if(window.isSecureContext===false){gerr='Location needs a secure (https) page. Host this file on https to use it.';return paint()}
  v.share=true;lastSave=0;
  W=navigator.geolocation.watchPosition(p=>{gerr='';const d=me();if(!d)return;
      d.gps={lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy||0),t:Date.now()};
      if(Date.now()-lastSave>8000){lastSave=Date.now();save()}paint()},
    err=>{if(err&&err.code==1){gerr='Location permission was denied. Allow location for this site in your browser settings, then tap Start again.';stopGeo(false);return}
      gerr=err&&err.code==3?'Still looking for a GPS signal…':'Your position is unavailable right now. Check GPS and signal.';paint()},
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  try{L('📍 '+v.driver+' ('+v.id+') started sharing live location')}catch(_){}
  save();paint()}
window.geoToggle=function(){if(W!==null)stopGeo(true);else startGeo()};
const _dv=dView;
window.dView=function(){const h=_dv();if(!me())return h;
  const card='<div class="card" style="margin-bottom:12px" id="gshBox">'+gcard()+'</div>',mk='<div class="card" style="margin-bottom:12px"><h3>My deliveries (',i=h.indexOf(mk);
  return i<0?card+h:h.slice(0,i)+card+h.slice(i)};
const _th=toHome;
window.toHome=function(){if(W!==null)stopGeo(false);return _th.apply(this,arguments)};

/* ===== Customer side: driver + operator numbers and driver location ===== */
function drvCard(v,ids,open){const p=tel(v.phone);let loc='';
  if(open){
    if(live(v))loc=`<div class="alert" style="border-color:var(--grn);margin:10px 0 0">📍 <b>Live location</b> · updated ${ago(v.gps.t)}<br><span style="color:var(--mut)">Accuracy about ${v.gps.acc||'?'} m</span><br><a href="${mapsUrl(v.gps)}" target="_blank" rel="noopener" style="color:var(--acct);font-weight:800">🗺️ Open in Maps</a></div>`;
    else if(v.share&&gpsOK(v))loc=`<div class="alert" style="border-color:var(--amb);margin:10px 0 0">📍 Location is not updating. Last seen ${ago(v.gps.t)}.<br><a href="${mapsUrl(v.gps)}" target="_blank" rel="noopener" style="color:var(--acct);font-weight:800">🗺️ Open last position</a></div>`;
    else loc=`<div class="alert" style="border-color:var(--line);margin:10px 0 0">📍 The driver has not shared live location. Last known area: <b>${e(v.loc||'—')}</b></div>`}
  else loc=`<div class="contact-meta">✅ Your delivery on this truck is complete.</div>`;
  return `<div class="contact-card"><div class="contact-role">🚚 Driver</div><div class="contact-name">${e(v.driver)}</div>
<div class="contact-meta">Truck ${e(v.id)} · ${e(ids.join(', '))}</div>
<div class="contact-meta">📞 ${p?`<a href="tel:${p}" style="color:var(--acct);font-weight:800;text-decoration:none">${e(v.phone)}</a>`:'Phone number not added'}</div>${loc}
${p?`<div class="contact-actions"><a class="call" href="tel:${p}">📞 Call driver</a><a class="sms" href="sms:${p}">💬 SMS</a></div>`:''}</div>`}
function opCard(o){const p=tel(o.phone);
  return `<div class="contact-card"><div class="contact-role">🖥️ Operator</div><div class="contact-name">${e(o.name||o.id)}</div>
<div class="contact-meta">📞 ${p?`<a href="tel:${p}" style="color:var(--acct);font-weight:800;text-decoration:none">${e(o.phone)}</a>`:'Phone number not added'}</div>
${p?`<div class="contact-actions"><a class="call" href="tel:${p}">📞 Call operator</a><a class="sms" href="sms:${p}">💬 SMS</a></div>`:''}</div>`}
function team(c){const mine=S.del.filter(x=>x.cust==c.name),by={};
  mine.forEach(x=>{if(!x.veh)return;(by[x.veh]=by[x.veh]||{ids:[],open:false}).ids.push(x.id);if(x.status!='COMPLETED')by[x.veh].open=true});
  const dl=Object.keys(by).map(id=>({v:S.veh.find(q=>q.id==id),g:by[id]})).filter(r=>r.v).sort((a,b)=>b.g.open-a.g.open);
  const ops=ACC.ops||[];
  return `<h3 style="margin:4px 0 4px">📞 Your delivery team</h3><p style="color:var(--mut);margin:0 0 10px">Call or text your driver or our operators about your delivery.</p>
<h3 style="margin:8px 0 8px;font-size:15px">🚚 Drivers</h3><div class="contact-grid" style="margin-bottom:14px">${dl.length?dl.map(r=>drvCard(r.v,r.g.ids,r.g.open)).join(''):'<div class="contact-empty">No driver is assigned to your deliveries yet.</div>'}</div>
<h3 style="margin:8px 0 8px;font-size:15px">🖥️ Operators</h3><div class="contact-grid" style="margin-bottom:16px">${ops.length?ops.map(opCard).join(''):'<div class="contact-empty">No operators found.</div>'}</div>`}
const _cv=cView;
window.cView=function(){const h=_cv(),c=ACC.cu.find(x=>x.id==CID);if(!c)return h;
  const mk='<h3 style="margin:4px 0 8px">My deliveries</h3>',t=team(c);
  return h.indexOf(mk)<0?h+t:h.replace(mk,()=>t+mk)};
/* keep the customer's location card fresh while any driver is sharing */
setInterval(()=>{if(role=='cu'&&document.getElementById('cview')&&S.veh.some(v=>v.share)&&!(document.activeElement&&document.activeElement.tagName=='TEXTAREA'))cRender()},20000);
})();
</script>

<script>
/* ================= ROUTEPILOT BACKEND BRIDGE ================= */
(function(){
  const API = window.location.origin + '/api';
  let token = localStorage.getItem('routepilot_token') || '';
  const oldSave = window.save;
  async function api(path, opts={}){
    const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
    if(token) headers.Authorization='Bearer '+token;
    const r=await fetch(API+path,Object.assign({},opts,{headers}));
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||('Request failed: '+r.status));
    return data;
  }
  window.rpApi=api;
  async function pull(){
    if(!token)return false;
    try{
      const x=await api('/state');
      if(x.state){
        S.routes=x.state.routes||S.routes; S.veh=x.state.veh||S.veh; S.del=x.state.del||S.del; S.dis=x.state.dis||[]; S.log=x.state.log||[]; S.applied=x.state.applied||false;
        ACC=x.state.acc||ACC; ACC.req=ACC.req||[]; ACC.audit=ACC.audit||[]; ACC.inc=ACC.inc||[]; ACC.cu=ACC.cu||[];
      }
      return true;
    }catch(e){ token=''; localStorage.removeItem('routepilot_token'); return false; }
  }
  window.save=async function(){
    try{
      if(token){ await api('/state',{method:'PUT',body:JSON.stringify({state:{routes:S.routes,veh:S.veh,del:S.del,dis:S.dis,log:S.log,applied:S.applied,acc:ACC}})}); return true; }
      return oldSave ? oldSave() : false;
    }catch(e){ console.error('RoutePilot sync failed',e); return false; }
  };
  window.doLogin=async function(){
    const t=lt, id=(document.querySelector('#lu')||{}).value?.trim()||'', pw=(document.querySelector('#lp')||{}).value||'', m=document.querySelector('#lerr');
    if(m)m.textContent='';
    try{
      const x=await api('/auth/login',{method:'POST',body:JSON.stringify({role:t,id,password:pw})});
      token=x.token; localStorage.setItem('routepilot_token',token); U=x.user;
      await pull();
      if(U.role==='drv'){ME=U.id;dsent=null;photoOK=false;openDriver();return;}
      if(U.role==='cu'){CID=U.id;openCustomer();return;}
      role=U.role; document.querySelector('#home').style.display='none'; enter();
    }catch(e){if(m)m.textContent=e.message||'Login failed';}
  };
  window.sendReq=async function(){
    const t=lt,u=(document.querySelector('#lu')||{}).value?.trim()||'',note=(document.querySelector('#lm')||{}).value||'';let who='',name='';
    if(t==='drv'){const v=S.veh.find(x=>x.id===u);if(!v)return ($('#lerr').textContent='Please select your truck.');who=v.id;name=v.driver}
    else if(t==='cu'){const c=ACC.cu.find(x=>x.id===u);if(!c)return ($('#lerr').textContent='Please select your customer.');who=c.id;name=c.name}
    else {const o=(ACC.ops||[]).find(x=>x.id.toLowerCase()===u.toLowerCase());if(!o)return ($('#lerr').textContent='Operator ID not found.');who=o.id;name=o.name}
    try{await api('/password-requests',{method:'POST',body:JSON.stringify({role:t,userId:who,name,note})});hm='sent';renderHome()}catch(e){$('#lerr').textContent=e.message}
  };
  window.pwReset=async function(kind,id){
    if(!['ow','op'].includes(role))return alert('You do not have permission to reset passwords.');
    const password=prompt('Enter a new password (minimum 4 characters):'); if(password===null)return;
    try{await api('/users/'+encodeURIComponent(id)+'/password',{method:'POST',body:JSON.stringify({password})}); alert('Password updated successfully.'); go('requests');}
    catch(e){alert(e.message)}
  };
  const oldProf=window.profEdit;
  window.profEdit=async function(){
    const phone=prompt('Your phone number:',U?.phone||ACC?.owner?.phone||''); if(phone===null)return;
    const email=prompt('Your email:',U?.email||ACC?.owner?.email||''); if(email===null)return;
    try{await api('/users/'+encodeURIComponent(U.id)+'/contact',{method:'PUT',body:JSON.stringify({phone,email})}); U.phone=phone;U.email=email;if(U.role==='ow'){ACC.owner.phone=phone;ACC.owner.email=email} alert('Profile updated.');}catch(e){alert(e.message)}
  };
  window.rpLogout=function(){token='';localStorage.removeItem('routepilot_token');try{localStorage.removeItem('rp')}catch(e){}location.reload()};
  const boot=async()=>{
    await pull();
    renderHome();
    // If a valid session exists, restore it.
    if(token){try{const me=await api('/me');U=me.user;role=U.role;if(role==='drv'){ME=U.id;openDriver()}else if(role==='cu'){CID=U.id;openCustomer()}else{document.querySelector('#home').style.display='none';enter()}}catch(e){token='';localStorage.removeItem('routepilot_token')}}
  };
  // Replace the existing Log out buttons without rewriting the large UI.
  document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('button');if(el&&el.textContent.trim()==='Log out'){e.preventDefault();rpLogout()}});
  boot();
})();
</script>
</body></html>
